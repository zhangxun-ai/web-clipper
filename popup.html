<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>文档本地导出</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <main class="app">
      <header class="topbar">
        <div class="brand">
          <span class="brand-mark" aria-hidden="true"><svg class="ui-icon" viewBox="0 0 24 24"><path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9Z"/><path d="M14 3v6h6M8 13h5M8 17h8"/></svg></span>
          <div class="topbar-copy">
            <h1>文档本地导出</h1>
          </div>
        </div>
        <a id="openExportSettings" class="topbar-link" href="#popupAdvancedSettings" aria-label="打开导出设置" title="导出设置"><svg class="ui-icon" aria-hidden="true" viewBox="0 0 24 24"><path d="M4 7h9m4 0h3M4 17h3m4 0h9"/><circle cx="15" cy="7" r="2"/><circle cx="9" cy="17" r="2"/></svg></a>
      </header>

      <section id="workspaceShell" class="panel workspace-shell" aria-label="当前页面导出">
        <div class="workspace-main">
          <section class="surface-card" aria-labelledby="docTitle">
            <div id="status" class="status status-loading" role="status" aria-live="polite">正在检测当前页面…</div>
            <div class="surface-copy">
              <h2 id="docTitle">正在读取文章标题…</h2>
              <div class="source-meta">
                <span id="docType" class="meta-value">正在识别类型</span>
                <span id="detectedCategoryBadge" class="category-badge">识别中</span>
              </div>
              <p id="primarySummary" class="subtitle-inline">正在检查可用的导出方式…</p>
            </div>
          </section>

          <section class="surface-card preset-panel" aria-labelledby="presetHeading">
            <div class="panel-head preset-heading">
              <h2 id="presetHeading">导出方式</h2>
              <p id="presetSummary" class="subtitle-inline" aria-live="polite" hidden></p>
            </div>
            <div id="presetBar" class="preset-bar" aria-label="导出方式">
              <button class="preset-card" type="button" data-preset="quick-export" aria-pressed="false">
                <span class="preset-title">快速导出</span>
                <span class="preset-desc">纯文字 Markdown</span>
              </button>
              <button class="preset-card" type="button" data-preset="ai-ready" aria-pressed="false">
                <span class="preset-title">带图留档</span>
                <span class="preset-desc">图文离线保存</span>
              </button>
              <button class="preset-card" type="button" data-preset="obsidian" aria-pressed="false">
                <span class="preset-title">Obsidian</span>
                <span class="preset-desc">写入笔记目录</span>
              </button>
            </div>
            <div class="actions">
              <button id="primaryAction" class="button button-primary" type="button" disabled>导出当前页面</button>
              <button id="openFeishuSave" class="button" type="button" disabled>保存到飞书</button>
              <button id="secondaryAction" class="button" type="button" hidden disabled>更多操作</button>
            </div>
          </section>
        </div>
            <details id="popupAdvancedSettings" class="advanced-settings">
              <summary class="advanced-summary">自定义导出设置</summary>
              <div class="advanced-content">
                <div class="quick-card">
                  <span class="field-label">输出目标</span>
                  <div class="segmented" role="radiogroup" aria-label="输出目标">
                    <label class="segment">
                      <input id="outputTargetDownload" type="radio" name="outputTarget" value="download" checked>
                      <span>仅下载</span>
                    </label>
                    <label class="segment">
                      <input id="outputTargetBoth" type="radio" name="outputTarget" value="both">
                      <span>下载 + Obsidian</span>
                    </label>
                    <label class="segment">
                      <input id="outputTargetObsidian" type="radio" name="outputTarget" value="obsidian">
                      <span>仅 Obsidian</span>
                    </label>
                  </div>
                </div>

                <label class="toggle toggle-quick" for="includeImages">
                  <input id="includeImages" type="checkbox">
                  <span class="toggle-copy">
                    <span class="toggle-title">保留图片</span>
                    <span class="toggle-desc">将图片嵌入 Markdown，离线可查看，文件体积会增大。</span>
                  </span>
                </label>

                <p id="primaryHint" class="hint">当前页的主操作会始终显示在这里。</p>
              </div>
            </details>
      </section>

      <details id="toolsDrawer" class="advanced-settings tools-drawer">
        <summary class="advanced-summary"><svg class="ui-icon" aria-hidden="true" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>批量与专栏工具</summary>
        <div class="tools-content">
          <div class="category-tabs" role="tablist" aria-label="更多工具分类">
            <button id="categoryTabWechat" class="category-tab" type="button" role="tab" aria-controls="categoryToolsPanel" aria-selected="false" tabindex="-1" data-category="wechat">微信公众号</button>
            <button id="categoryTabFeishu" class="category-tab" type="button" role="tab" aria-controls="categoryToolsPanel" aria-selected="false" tabindex="-1" data-category="feishu">飞书</button>
            <button id="categoryTabScys" class="category-tab" type="button" role="tab" aria-controls="categoryToolsPanel" aria-selected="false" tabindex="-1" data-category="scys">生财有术</button>
            <button id="categoryTabOther" class="category-tab" type="button" role="tab" aria-controls="categoryToolsPanel" aria-selected="false" tabindex="-1" data-category="other">其它</button>
          </div>
          <div id="categoryToolsPanel" class="tools-content" role="tabpanel" tabindex="0">
      <section id="scysWorkspace" class="panel workspace-panel" hidden>
        <div class="panel-head panel-head-tight">
          <h2>课程专栏导出</h2>
        </div>

        <p id="scysWorkspaceNote" class="hint workspace-hint">请先打开生财课程章节。</p>

        <div class="actions">
          <button id="scysExportCourse" class="button button-primary" type="button" disabled>导出当前专栏</button>
          <button id="scysExportCurrent" class="button" type="button" disabled>仅导出当前章节</button>
        </div>
      </section>

      <section id="batchWorkspace" class="panel workspace-panel" hidden>
        <div class="panel-head panel-head-tight">
          <h2 id="batchWorkspaceTitle">批量下载</h2>
          <p id="batchWorkspaceSummary" class="subtitle-inline">粘贴多个链接后，会打开独立任务页继续执行。</p>
        </div>

        <div id="batchStatus" class="status status-loading" role="status" aria-live="polite" hidden></div>

        <div class="field-group">
          <label id="batchLinksLabel" class="field-label" for="batchLinks">文章链接列表</label>
          <textarea
            id="batchLinks"
            class="text-input text-area"
            placeholder="每行一个链接。"
          ></textarea>
          <label class="toggle toggle-compact" for="batchZipOutput">
            <input id="batchZipOutput" type="checkbox" checked>
            <span class="toggle-copy">
              <span class="toggle-title">批量结果打包为 ZIP</span>
              <span class="toggle-desc">仅对本地下载生效，便于保存和管理。</span>
            </span>
          </label>
          <button id="batchDownloadLinks" class="button button-primary" type="button">批量下载链接列表</button>
          <div id="batchLog" class="log" aria-live="polite"></div>
        </div>
      </section>

      <section id="wechatWorkspace" class="panel workspace-panel" hidden>
        <div class="panel-head panel-head-tight">
          <h2>按日期下载公众号文章</h2>
          <p class="subtitle-inline">需登录公众号后台，按日期下载同号文章。</p>
        </div>

        <div id="helperStatus" class="status status-loading" role="status" aria-live="polite" hidden></div>

        <div class="field-group">
          <label class="field-label" for="helperSeedUrl">该公众号任意一篇文章链接</label>
          <textarea
            id="helperSeedUrl"
            class="text-input text-area text-area-compact"
            placeholder="https://mp.weixin.qq.com/s/…"
          ></textarea>
        </div>

        <div class="field-row">
          <div class="field-group field-group-tight">
            <label class="field-label" for="helperStartDate">开始日期</label>
            <input id="helperStartDate" class="text-input" type="date">
          </div>
          <div class="field-group field-group-tight">
            <label class="field-label" for="helperEndDate">结束日期</label>
            <input id="helperEndDate" class="text-input" type="date">
          </div>
        </div>

        <label class="toggle toggle-compact" for="includeImagesHelper">
          <input id="includeImagesHelper" type="checkbox" checked>
          <span class="toggle-copy">
            <span class="toggle-title">下载正文图片</span>
            <span class="toggle-desc">关闭后仅保存文字。</span>
          </span>
        </label>

        <div class="actions actions-uneven">
          <button id="helperCheck" class="button" type="button">检查登录状态</button>
          <button id="openWechatMpLogin" class="button" type="button">打开公众号后台</button>
          <button id="helperDownload" class="button button-primary" type="button">按范围批量下载</button>
        </div>

        <div id="helperLog" class="log" aria-live="polite"></div>
      </section>

      <section id="otherWorkspace" class="panel workspace-panel" hidden>
        <div class="panel-head panel-head-tight">
          <h2>其它网页</h2>
        </div>

        <p id="otherWorkspaceNote" class="hint workspace-hint">使用上方按钮保存当前网页。</p>
      </section>


          </div>
        </div>
      </details>

      <details id="obsidianDock" class="advanced-settings obsidian-dock">
        <summary class="advanced-summary"><svg class="ui-icon" aria-hidden="true" viewBox="0 0 24 24"><path d="M3 7a2 2 0 0 1 2-2h5l2 2h7a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2Z"/><path d="M8 13h8"/></svg>Obsidian 目录<span id="obsidianSummary" class="obsidian-dock-value">尚未配置</span></summary>
        <div class="advanced-content">
          <p class="hint">选择 Vault 内的文件夹，导出的笔记会直接保存到这里。</p>
          <div class="obsidian-dock-main">
            <span id="obsidianFolder" class="obsidian-dock-path" hidden></span>
            <div class="obsidian-dock-actions">
              <button id="pickObsidianFolder" class="button button-small" type="button">选择目标目录</button>
              <button id="clearObsidianFolder" class="button button-small" type="button">清除授权</button>
            </div>
          </div>
          <div id="obsidianStatus" class="status status-loading" role="status" aria-live="polite" hidden></div>
        </div>
      </details>
    </main>

    <script src="shared/export-url-utils.js"></script>
    <script src="shared/export-ui-models.js"></script>
    <script src="shared/obsidian-export.js"></script>
    <script src="shared/obsidian-vault-storage.js"></script>
    <script src="wechat-markdown-cleanup.js"></script>
    <script type="module" src="popup.js"></script>
  </body>
</html>
